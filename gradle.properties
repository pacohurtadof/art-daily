# El heap por defecto de Gradle (~512MB-1GB) no le alcanza a R8 para generar el dex de debug
# de este proyecto (Compose + Room + Hilt + Retrofit + Coil + Glance + WorkManager) — tronaba
# con "OutOfMemoryError: Java heap space" en mergeExtDexDebug. Verificado el 2026-08-17.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

android.useAndroidX=true
org.gradle.parallel=true
