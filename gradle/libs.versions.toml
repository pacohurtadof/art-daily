[versions]
# --- Toolchain ---
# kotlin/ksp verificados en vivo contra Maven Central + GitHub releases el 2026-08-17.
# Desde KSP 2.x el plugin ya NO usa el sufijo "-kspVersion" (ej. "2.3.21-2.0.2", que nunca
# existió — probablemente un artefacto de una sesión de chat sin acceso en vivo a Maven).
# KSP ahora versiona independiente y apunta a una línea de Kotlin completa ("Kotlin 2.3"),
# no a un patch exacto — por eso puede quedarse en 2.3.11 mientras el compilador de Kotlin
# ya va en 2.3.21 (confirmado: KSP 2.3.7 "Bumped Kotlin target language version to 2.3").
agp = "9.3.0"
kotlin = "2.3.21"
ksp = "2.3.11"

# --- Compose ---
composeBom = "2026.06.01"

# --- AndroidX core ---
coreKtx = "1.16.0"
lifecycle = "2.9.4"
activityCompose = "1.10.0"
navigationCompose = "2.9.8"
splashscreen = "1.2.0"

# --- Room (2.x línea estable; Room 3.0 sigue en alpha, no se usa todavía) ---
room = "2.8.4"

# --- DI ---
# Hilt solo soporta AGP 9 desde 2.59 (ver release notes de dagger/hilt) — 2.56.2 es anterior
# a ese soporte y fallaba con "Android BaseExtension not found" al aplicarse. Verificado
# en vivo el 2026-08-17 contra Maven Central + GitHub releases de google/dagger.
hilt = "2.60.1"
# androidx.hilt (hilt-navigation-compose, hilt-work, hilt-compiler) iba en 1.2.0 — 2 versiones
# menores atrás; se sube a la real más reciente. Verificado el 2026-08-17.
androidxHilt = "1.4.0"

# --- Red ---
retrofit = "3.0.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.9.0"
# Solo :harvester (ingesta de National Gallery of Art: dataset CSV en GitHub, no una API
# REST — ver `harvester/nga/`). Verificado contra Maven Central el 2026-09-04.
commonsCsv = "1.14.1"
# 1.10.2, no la más reciente (1.11.0): androidx.test:core:1.7.0 trae una restricción interna
# "strictly 1.10.2" sobre kotlinx-coroutines-bom que fuerza esa versión en tiempo de
# ejecución sin importar lo que se pida aquí — pedir 1.11.0 causaba NoSuchMethodError en el
# emulador porque kotlinx-coroutines-test:1.11.0 llama a un método que solo existe en el
# 1.11.0 real del core, pero en runtime terminaba resuelto al 1.10.2 forzado. Verificado con
# `./gradlew :app:dependencies` el 2026-08-17.
kotlinxCoroutines = "1.10.2"

# --- Imágenes ---
coil = "3.4.0"

# --- Traducción on-device (ML Kit) ---
# Verificado en vivo contra dl.google.com el 2026-08-19.
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
# Misma versión exacta que kotlinxCoroutines (1.10.2) — no la 1.11.0 más reciente, por el
# mismo motivo documentado arriba (androidx.test:core fuerza 1.10.2 en runtime).
kotlinxCoroutinesPlayServices = "1.10.2"

# --- Widget / background ---
glance = "1.1.1"
workManager = "2.11.2"

# --- Testing ---
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxTest = "1.7.0"
# ui-test-junit4-android trae espresso-core 3.5.0 transitivamente (2022) — en este
# dispositivo de prueba falla con NoSuchMethodException en
# InputManager.getInstance() (API interna que cambió en versiones de Android más
# nuevas que esa versión de Espresso no conoce). Se fuerza una versión más reciente.
# Verificado contra dl.google.com/android/maven2 el 2026-08-21: última estable 3.7.0.
espressoCore = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Solo el set "core" (~40 iconos comunes: Home, Search, Favorite...), NO
# material-icons-extended (esa trae miles de iconos y agrega varios MB al APK).
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Tests de UI de Compose (equivalente a Selenium/Playwright, pero para Compose nativo) —
# corren instrumentados (emulador/dispositivo real), no en la JVM del desarrollador.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
commons-csv = { group = "org.apache.commons", name = "commons-csv", version.ref = "commonsCsv" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
mlkit-language-id = { group = "com.google.mlkit", name = "language-id", version.ref = "mlkitLanguageId" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutinesPlayServices" }

androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
